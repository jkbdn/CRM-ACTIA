services:
  - type: web
    runtime: node
    name: arquitectura-crm
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: CRM_DB_PATH
        value: /var/data/crm.sqlite
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
